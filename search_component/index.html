<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* colors arrive from Python (theme.py) as CSS variables */
  html, body { margin: 0; background: transparent; }
  body {
    font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
    color: var(--text);
    padding: 2px 22px 30px;   /* room for glow and shadow, which the iframe would clip */
  }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--accent); margin: 0 0 8px 2px; }
  .box {
    display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 16px;
    background: var(--surface); border: 2px solid var(--accent2); border-radius: 14px;
    box-shadow: 0 0 20px rgba(var(--glow), calc(0.3 * var(--k)));
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .box:focus-within { border-color: var(--accent); box-shadow: 0 0 24px rgba(var(--glow), calc(0.55 * var(--k))); }
  .box svg { flex: none; color: var(--muted); }
  input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 17px;
  }
  input::placeholder { color: var(--muted); }
  .clear {
    flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 8px;
  }
  .clear:hover { color: var(--text); background: var(--hover); }
  [hidden] { display: none !important; }

  .panel {
    margin-top: 8px; background: var(--surface); border: 1px solid var(--accent2);
    border-radius: 14px; overflow: hidden; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  }
  ul { list-style: none; margin: 0; padding: 6px; }
  li {
    display: flex; align-items: baseline; gap: 10px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer;
  }
  li.active { background: var(--hover); }
  .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t mark { background: transparent; color: var(--accent); }
  .y { color: var(--muted); flex: none; }
  .g { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; flex: none; }
  .status { margin: 0; padding: 12px 16px; color: var(--muted); font-size: 15px; }
  .keys { margin: 0; padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
  @media (max-width: 480px) { .g, .keys { display: none; } }
</style>
</head>
<body>
  <label id="label" for="q">Search movies</label>
  <div class="box">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Search by title, e.g. Get Out" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="false" aria-controls="list">
    <button id="clear" class="clear" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>
  <div id="panel" class="panel" hidden>
    <ul id="list" role="listbox"></ul>
    <p id="status" class="status" hidden></p>
    <p class="keys">↑ ↓ to move · Enter to pick · Esc to close</p>
  </div>

<script>
const input = document.getElementById("q");
const panel = document.getElementById("panel");
const list = document.getElementById("list");
const statusLine = document.getElementById("status");
const clearButton = document.getElementById("clear");
const label = document.getElementById("label");

let movies = null;        // loaded once from titles.json, most-rated first
let loading = null;
let results = [];
let active = 0;
let lastInitial = null;

// "Amélie" and "amelie" should match each other
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function send(type, data) {
  window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
}

function resize() {
  send("streamlit:setFrameHeight", {height: document.body.scrollHeight});
}

function load(version) {
  if (loading) return;
  loading = fetch("titles.json?v=" + version)
    .then(r => r.json())
    .then(rows => {
      movies = rows.map(([row, title, year, genres]) => ({
        row, title, year, genres, key: norm(year ? title + " " + year : title),
      }));
      update();
    })
    .catch(() => {
      statusLine.textContent = "Couldn't load the movie list. Refresh the page to try again.";
      statusLine.hidden = false;
      resize();
    });
}

// Titles starting with the query (ignoring The/A/An) first, then titles with a
// word starting with it, then anything containing it. The list is already
// sorted by popularity, so each group comes out most-rated first.
function search(query) {
  const q = norm(query).trim();
  const first = [], word = [], rest = [];
  for (const m of movies) {
    const i = m.key.indexOf(q);
    if (i < 0) continue;
    const before = m.key.slice(0, i);
    if (i === 0 || before === "the " || before === "a " || before === "an ") {
      first.push(m);
      if (first.length === 8) break;
    } else if (/[^a-z0-9]/.test(m.key[i - 1])) {
      if (word.length < 8) word.push(m);
    } else if (rest.length < 8) {
      rest.push(m);
    }
  }
  return first.concat(word, rest).slice(0, 8);
}

function highlight(title, query) {
  const q = norm(query).trim();
  const i = norm(title).indexOf(q);
  if (i < 0 || norm(title).length !== title.length) return esc(title);
  return esc(title.slice(0, i)) + "<mark>" + esc(title.slice(i, i + q.length)) + "</mark>" + esc(title.slice(i + q.length));
}

function setActive(i) {
  active = i;
  list.querySelectorAll("li").forEach((li, n) => li.classList.toggle("active", n === i));
  input.setAttribute("aria-activedescendant", "opt" + i);
}

function close() {
  panel.hidden = true;
  input.setAttribute("aria-expanded", "false");
  resize();
}

function update() {
  const query = input.value;
  clearButton.hidden = !query;
  if (!query.trim()) return close();

  panel.hidden = false;
  input.setAttribute("aria-expanded", "true");
  if (!movies) {
    list.innerHTML = "";
    statusLine.textContent = "Loading titles…";
    statusLine.hidden = false;
    return resize();
  }
  results = search(query);
  list.innerHTML = results.map((m, i) =>
    `<li id="opt${i}" role="option" data-i="${i}">` +
    `<span class="t">${highlight(m.title, query)}</span>` +
    (m.year ? `<span class="y">${m.year}</span>` : "") +
    `<span class="g">${esc(m.genres)}</span></li>`
  ).join("");
  statusLine.hidden = results.length > 0;
  statusLine.textContent = results.length ? "" : `No movie matches “${query.trim()}”`;
  setActive(0);
  resize();
}

function pick(i) {
  const m = results[i];
  if (!m) return;
  input.value = m.year ? `${m.title} (${m.year})` : m.title;
  close();
  input.blur();
  send("streamlit:setComponentValue", {value: {row: m.row, at: Date.now()}, dataType: "json"});
}

input.addEventListener("input", update);
input.addEventListener("focus", () => input.select());
input.addEventListener("blur", () => setTimeout(close, 150));
input.addEventListener("keydown", e => {
  if (panel.hidden && e.key !== "Escape") {
    if (e.key === "ArrowDown") update();
    return;
  }
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(active + 1, results.length - 1)); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
  else if (e.key === "Enter") { e.preventDefault(); pick(active); }
  else if (e.key === "Escape") { close(); }
});
// mousedown, not click, so the input keeps focus until the pick happens
list.addEventListener("mousedown", e => {
  const li = e.target.closest("li");
  if (li) { e.preventDefault(); pick(Number(li.dataset.i)); }
});
list.addEventListener("mousemove", e => {
  const li = e.target.closest("li");
  if (li && Number(li.dataset.i) !== active) setActive(Number(li.dataset.i));
});
clearButton.addEventListener("click", () => { input.value = ""; update(); input.focus(); });

window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const args = e.data.args;
  for (const [name, value] of Object.entries(args.colors)) {
    document.documentElement.style.setProperty("--" + name, value);
  }
  label.textContent = `Search ${args.count.toLocaleString("en-US")} movies`;
  // show the picked title when coming back to the page, but never overwrite typing
  if (args.initial !== lastInitial) {
    lastInitial = args.initial;
    if (document.activeElement !== input) {
      input.value = args.initial || "";
      clearButton.hidden = !input.value;
    }
  }
  load(args.version);
  resize();
});
new ResizeObserver(resize).observe(document.body);
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
